<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Harga Online</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* Latar belakang bersih/putih */
            margin: 0;
            padding: 5% 8%; /* Memberi jarak aman dari tepi layar */
            color: #333;
        }
        
        /* Container tanpa batas kotak/bayangan */
        .container {
            max-width: 800px; /* Batas lebar maksimal di PC agar tidak memanjang berlebihan, di HP akan full */
            margin: 0 auto;
        }

        h2 {
            font-size: 32px;
            margin-top: 0;
            margin-bottom: 30px;
            color: #222;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result-box {
            margin-top: 40px;
            padding: 20px;
            background-color: #e9ecef; /* Latar abu-abu sangat tipis */
            border-radius: 4px;
            text-align: center;
        }

        .result-title {
            color: #666;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .result-value {
            color: #28a745;
            font-size: 36px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kalkulator Harga</h2>
        
        <div class="form-group">
            <label for="targetBersih">Target Bersih (Rp)</label>
            <input type="number" id="targetBersih" placeholder="Contoh: 100000">
        </div>
        
        <div class="form-group">
            <label for="feeRate">Potongan Platform (%)</label>
            <input type="number" id="feeRate" placeholder="Contoh: 5.5" step="0.1">
        </div>
        
        <button onclick="hitungHarga()">Hitung Minimal</button>

        <div class="result-box">
            <div class="result-title">Harga Minimal Online:</div>
            <div class="result-value" id="hasil">Rp 0</div>
        </div>
    </div>

    <script>
        function hitungHarga() {
            let targetBersih = parseFloat(document.getElementById('targetBersih').value);
            let feeRateInput = parseFloat(document.getElementById('feeRate').value);
            
            if (isNaN(targetBersih) || isNaN(feeRateInput)) {
                document.getElementById('hasil').innerText = "Masukkan angka!";
                document.getElementById('hasil').style.color = "red";
                return;
            }

            if (feeRateInput >= 100) {
                document.getElementById('hasil').innerText = "Potongan error!";
                document.getElementById('hasil').style.color = "red";
                return;
            }

            let feeRate = feeRateInput / 100;
            let hargaMinimal = targetBersih / (1 - feeRate);

            // Pembulatan ke ratusan terdekat
            let hargaDibulatkan = Math.round(hargaMinimal / 100) * 100;

            let formatRupiah = new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(hargaDibulatkan);

            document.getElementById('hasil').style.color = "#28a745"; 
            document.getElementById('hasil').innerText = formatRupiah;
        }
    </script>

</body>
</html>
